name: Documentation

on:
  pull_request:
    paths:
      - ".github/pull_request_template.md"
      - ".github/workflows/docs.yml"
      - "AGENTS.md"
      - "README.md"
      - "build.zig"
      - "config/**"
      - "docs/**"
      - "linker/**"
      - "src/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/**"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/pull_request_template.md"
      - ".github/workflows/docs.yml"
      - "AGENTS.md"
      - "README.md"
      - "build.zig"
      - "config/**"
      - "docs/**"
      - "linker/**"
      - "src/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-docs.txt
      - run: scripts/docs/verify-code-guide.sh
