site_name: Kay OS Code Companion
site_description: A guided, evidence-aware tour of the Kay OS implementation
site_url: https://pcharbon70.github.io/kay-os/
repo_url: https://github.com/pcharbon70/kay-os
repo_name: pcharbon70/kay-os
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.code.select
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Code Companion:
      - Overview: code-guide/index.md
      - M0 build and ABI: code-guide/m0-build-and-abi.md
      - M0 boot and interface contracts: code-guide/m0-boot-and-interface-contracts.md
      - Glossary: code-guide/glossary.md
      - Module guide template: code-guide/module-guide-template.md
  - M0 engineering records:
      - Phase 1 decisions: m0/phase-01-decisions.md
      - Build closure: m0/build-closure.md
      - Phase 1 integration: m0/phase-01-integration.md
      - Phase 2 decisions: m0/phase-02-decisions.md
